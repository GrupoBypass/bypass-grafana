name: Deploy Grafana

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Apply
        id: tf
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve 

      - name: Export Terraform outputs
        id: outputs
        run: |
          cd terraform
          echo "grafana_ip=$(terraform output -raw grafana_ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "grafana_backup=$(terraform output -raw grafana_backup_bucket)" >> $GITHUB_OUTPUT

      - name: Criar inventory Ansible
        run: |
          echo "[grafana]" > ansible/inventory.ini
          echo "${{ steps.outputs.outputs.grafana_ip }} ansible_user=ec2-user ansible_ssh_private_key_file=bypass-key.pem" >> ansible/inventory.ini

      - name: Adicionar chave SSH
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ansible/bypass-key.pem
          chmod 400 ansible/bypass-key.pem

      - name: Criar .env
        run: |
          cd ansible
          echo "GRAFANA_BACKUP_BUCKET=${{ steps.outputs.outputs.grafana_backup }}" > .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY_ID=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}" >> .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "PyYAML>=6" ansible docker docker-compose

      - name: Configurar EC2 com Ansible
        run: |
          cd ansible
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i inventory.ini setup.yml
